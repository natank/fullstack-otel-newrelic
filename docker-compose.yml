version: '3.8'

services:
  todo:
    build: 
      context: .
      dockerfile: docker/dockerfile.todo-service
    volumes:
      - .:/usr/src/app:rw
    ports:
      - 8081:8080
    environment:
      - NODE_ENV=development
      - OTEL_SERVICE_NAME=todo-service
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=todo-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp.nr-data.net:4317
    depends_on:
      - redis

  auth:
    build: 
      context: .
      dockerfile: docker/dockerfile.auth-service
    volumes:
      - .:/usr/src/app:rw
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - OTEL_SERVICE_NAME=auth-service
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=auth-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp.nr-data.net:4317
    depends_on:
      - redis

  redis:
    image: redis:latest
    ports:
      - '6379:6379'
